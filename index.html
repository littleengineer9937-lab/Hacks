<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1NT3R3ST1NG</title>

<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Interactive Starfield Layer */
  canvas#starfield {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    display: block;
  }

  /* Centered Main Wrapper */
  .center-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    padding: 20px;
  }

  /* Header Label Above Search Bar */
  .title-text {
    color: #ffffff;
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 0.05em;
    margin-bottom: 20px;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    user-select: none;
  }

  /* Outer Capsule with Rotating Light Beam */
  .search-bar-wrapper {
    position: relative;
    width: 100%;
    max-width: 360px;
    height: 48px;
    border-radius: 999px;
    padding: 1.5px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-bar-wrapper::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      transparent 280deg,
      rgba(255, 255, 255, 0.95) 330deg,
      transparent 360deg
    );
    animation: rotateAround 2.5s linear infinite;
  }

  @keyframes rotateAround {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Dark Inner Form Container */
  .search-form {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    width: 100%;
    height: 100%;
    background-color: #0c0d0f;
    padding: 0 16px;
    border-radius: 999px;
  }

  /* Magnifying Glass Icon */
  .search-icon {
    width: 16px;
    height: 16px;
    margin-right: 12px;
    position: relative;
    opacity: 0.6;
    flex-shrink: 0;
  }

  .search-icon::before {
    content: '';
    position: absolute;
    width: 11px;
    height: 11px;
    border: 1.8px solid #a1a1a1;
    border-radius: 50%;
    top: 0;
    left: 0;
  }

  .search-icon::after {
    content: '';
    position: absolute;
    width: 5px;
    height: 1.8px;
    background-color: #a1a1a1;
    top: 12px;
    left: 10px;
    transform: rotate(45deg);
  }

  /* Input Field */
  .search-input {
    flex-grow: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 16px;
    font-weight: 300;
    letter-spacing: -0.01em;
  }

  .search-input::placeholder {
    color: #a1a1a1;
    font-size: 16px;
    font-weight: 300;
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="center-container" id="main-ui">
  <div class="title-text">1NT3R3ST1NG</div>

  <div class="search-bar-wrapper">
    <form class="search-form" action="javascript:void(0);" onsubmit="handleSearch(event)">
      <div class="search-icon"></div>
      <input 
        type="search" 
        id="search-url" 
        class="search-input" 
        placeholder="search" 
        autocomplete="off" 
        autocorrect="off"
        autocapitalize="off"
        enterkeyhint="go"
        required 
      />
      <button type="submit" style="display: none;"></button>
    </form>
  </div>
</div>

<script>
// Canvas Starfield Engine
(function () {
  var canvas = document.getElementById('starfield');
  var ctx = canvas.getContext('2d');
  var stars = [];
  var mouse = { x: -9999, y: -9999 };

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function makeStar() {
    var warm = Math.random() < 0.12;
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: 0.5 + Math.random() * 1.1,
      alpha: 0.35 + Math.random() * 0.55,
      twSpeed: 0.15 + Math.random() * 0.35,
      twPhase: Math.random() * Math.PI * 2,
      vx: (Math.random() - 0.5) * 0.05,
      vy: (Math.random() - 0.5) * 0.05,
      color: warm ? '255,224,180' : '255,255,255',
      dx: 0, dy: 0
    };
  }

  function seedStars() {
    stars = [];
    var density = (canvas.width * canvas.height) / 9000;
    var count = Math.max(60, Math.min(280, Math.round(density)));
    for (var i = 0; i < count; i++) stars.push(makeStar());
  }
  seedStars();
  window.addEventListener('resize', seedStars);

  var shooters = [];

  function addShot() {
    var fromLeft = Math.random() < 0.5;
    var y0 = Math.random() * canvas.height * 0.6;
    var x0 = fromLeft ? -20 : canvas.width + 20;
    var speed = 6 + Math.random() * 5;
    var angle = fromLeft ? (Math.random() * 0.5 - 0.1) : Math.PI - (Math.random() * 0.5 - 0.1);
    shooters.push({
      x: x0, y: y0,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed + 1.5,
      len: 60 + Math.random() * 50,
      life: 1
    });
  }

  function spawnShooter() {
    addShot();
    if (Math.random() < 0.12) {
      window.setTimeout(addShot, 150 + Math.random() * 200);
    }
    window.setTimeout(spawnShooter, 2200 + Math.random() * 3200);
  }
  window.setTimeout(spawnShooter, 1200 + Math.random() * 2000);

  function onMove(e) {
    var p = e.touches ? e.touches[0] : e;
    mouse.x = p.clientX;
    mouse.y = p.clientY;
  }
  function onLeave() { mouse.x = -9999; mouse.y = -9999; }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseleave', onLeave);
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('touchend', onLeave);

  var t = 0;
  var REPEL_RADIUS = 70;

  function tick() {
    t += 0.016;
    var w = canvas.width, h = canvas.height;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.x += s.vx;
      s.y += s.vy;
      if (s.x < -5) s.x = w + 5;
      if (s.x > w + 5) s.x = -5;
      if (s.y < -5) s.y = h + 5;
      if (s.y > h + 5) s.y = -5;

      var px = s.x + s.dx, py = s.y + s.dy;
      var mdx = px - mouse.x, mdy = py - mouse.y;
      var dist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (dist < REPEL_RADIUS) {
        var force = (1 - dist / REPEL_RADIUS) * 10;
        var ang = Math.atan2(mdy, mdx);
        s.dx += Math.cos(ang) * force * 0.12;
        s.dy += Math.sin(ang) * force * 0.12;
      }
      s.dx *= 0.9;
      s.dy *= 0.9;

      var a = s.alpha * (0.8 + 0.2 * Math.sin(t * s.twSpeed + s.twPhase));
      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + s.color + ',' + a.toFixed(3) + ')';
      ctx.arc(s.x + s.dx, s.y + s.dy, s.size, 0, Math.PI * 2);
      ctx.fill();
    }

    for (var j = shooters.length - 1; j >= 0; j--) {
      var sh = shooters[j];
      sh.x += sh.vx;
      sh.y += sh.vy;
      var mag = Math.max(1, Math.hypot(sh.vx, sh.vy));
      var tx = sh.x - sh.vx * (sh.len / mag);
      var ty = sh.y - sh.vy * (sh.len / mag);
      var grad = ctx.createLinearGradient(sh.x, sh.y, tx, ty);
      grad.addColorStop(0, 'rgba(255,255,255,' + sh.life.toFixed(2) + ')');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(sh.x, sh.y);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      sh.life -= 0.012;
      if (sh.life <= 0 || sh.x < -100 || sh.x > w + 100 || sh.y > h + 100) {
        shooters.splice(j, 1);
      }
    }

    requestAnimationFrame(tick);
  }
  tick();
})();

// Form Navigation Handler — opens the search/URL in a new tab
function handleSearch(event) {
  if (event) event.preventDefault();

  var inputEl = document.getElementById('search-url');
  var inputVal = inputEl.value.trim();
  if (!inputVal) return;

  inputEl.blur();

  var targetUrl = inputVal;
  if (!/^https?:\/\//i.test(inputVal)) {
    if (inputVal.includes('.') && !inputVal.includes(' ')) {
      targetUrl = 'https://' + inputVal;
    } else {
      targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(inputVal);
    }
  }

  window.open(targetUrl, '_blank', 'noopener');
  inputEl.value = '';
}
</script>
</body>
</html>
