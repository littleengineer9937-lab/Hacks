<script>(function(){var canvas = document.getElementById('starfieldBg');var ctx = canvas.getContext('2d');var stars = [];var mouse ={x:-9999,y:-9999};function resize(){canvas.width = window.innerWidth;canvas.height = window.innerHeight;}resize();window.addEventListener('resize',resize);function makeStar(){var warm = Math.random()< 0.12;return{x:Math.random()* canvas.width,y:Math.random()* canvas.height,size:0.5 + Math.random()* 1.1,alpha:0.35 + Math.random()* 0.55,twSpeed:0.15 + Math.random()* 0.35,twPhase:Math.random()* Math.PI * 2,vx:(Math.random()- 0.5)* 0.05,vy:(Math.random()- 0.5)* 0.05,color:warm ? '255,224,180':'255,255,255',dx:0,dy:0};}var density =(canvas.width * canvas.height)/ 9000;var COUNT = Math.max(80,Math.min(260,Math.round(density)));for(var i = 0;i < COUNT;i)stars.push(makeStar());var shooters = [];function addShot(){var fromLeft = Math.random()< 0.5;var y0 = Math.random()* canvas.height * 0.6;var x0 = fromLeft ? -20:canvas.width + 20;var speed = 6 + Math.random()* 5;var angle = fromLeft ?(Math.random()* 0.5 - 0.1):Math.PI -(Math.random()* 0.5 - 0.1);shooters.push({x:x0,y:y0,vx:Math.cos(angle)* speed,vy:Math.sin(angle)* speed + 1.5,len:60 + Math.random()* 50,life:1});}function spawnShooter(){addShot();if(Math.random()< 0.12){window.setTimeout(addShot,150 + Math.random()* 200);}window.setTimeout(spawnShooter,2200 + Math.random()* 3200);}window.setTimeout(spawnShooter,1200 + Math.random()* 2000);document.addEventListener('mousemove',function(e){mouse.x = e.clientX;mouse.y = e.clientY;});document.addEventListener('mouseleave',function(){mouse.x = -9999;mouse.y = -9999;});var t = 0;var REPEL_RADIUS = 70;function tick(){t += 0.016;var w = canvas.width,h = canvas.height;ctx.fillStyle = '#000';ctx.fillRect(0,0,w,h);for(var i = 0;i < stars.length;i){var s = stars[i];s.x += s.vx;s.y += s.vy;if(s.x < -5)s.x = w + 5;if(s.x > w + 5)s.x = -5;if(s.y < -5)s.y = h + 5;if(s.y > h + 5)s.y = -5;var px = s.x + s.dx,py = s.y + s.dy;var mdx = px - mouse.x,mdy = py - mou <script>(function(){var BLUE_HINTS = ['89, 134, 218','89,134,218','79aadb','5986da'];function looksBlue(str){if(!str)return false;str = str.toLowerCase();return BLUE_HINTS.some(function(h){return str.indexOf(h)! -1;});}function stripBlue(el){if(!el || el.nodeType ! 1)return;var inline = el.getAttribute && el.getAttribute('style');if(looksBlue(inline)){el.style.setProperty('background','#121212','important');el.style.setProperty('background-color','#121212','important');el.style.setProperty('color','#f0f0f0','important');}var cs = window.getComputedStyle(el);if(looksBlue(cs.backgroundColor)|| looksBlue(cs.color)){el.style.setProperty('background','#121212','important');el.style.setProperty('background-color','#121212','important');el.style.setProperty('color','#f0f0f0','important');}}function hideSidebars(root){var nodes = root.querySelectorAll('[id*="sidebar" i], [class*="sidebar" i]');for(var i = 0;i < nodes.length;i){nodes[i].style.setProperty('display','none','important');}}function sweep(root){hideSidebars(root);var all = root.querySelectorAll('*');for(var i = 0;i < all.length;i)stripBlue(all[i]);}sweep(document);var observer = new MutationObserver(function(mutations){mutations.forEach(function(m){m.addedNodes.forEach(function(node){if(node.nodeType ! 1)return;hideSidebars(node.parentNode ? node.parentNode.ownerDocument:document);stripBlue(node);var descendants = node.querySelectorAll ? node.querySelectorAll('*'):[];for(var i = 0;i < descendants.length;i)stripBlue(descendants[i]);if(node.matches &&(node.matches('[id*="sidebar" i]')|| node.matches('[class*="sidebar" i]'))){node.style.setProperty('display','none','important');}});});});observer.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']});})();</script>
